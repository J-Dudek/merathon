[package]
name = "merathon-macros"
version = "0.1.0"
description = "Macro #[command] de Merathon : une seule déclaration pour la commande Tauri (bureau, Android) et pour la route du serveur (NAS)."
license = "MIT"
edition = "2021"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
